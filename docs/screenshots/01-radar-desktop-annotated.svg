<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="2800" height="5481" viewBox="0 0 2800 5481" role="img" aria-labelledby="title desc">
  <title id="title">Annotated desktop Event Opportunity Radar guide</title>
  <desc id="desc">Desktop screenshot with numbered arrows explaining navigation, radar console, filters, signal inspection, prompts, lifecycle, strategy, and contact.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c5ed4d"/></marker>
    <style>
      .label { font: 700 25px 'DM Mono', monospace; fill: #c5ed4d; letter-spacing: 1px; }
      .detail { font: 20px 'DM Mono', monospace; fill: #edf0df; }
      .line { stroke: #c5ed4d; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .tag { fill: #151a15; stroke: #c5ed4d; stroke-width: 2; rx: 8; }
    </style>
  </defs>
  <rect width="2800" height="5481" fill="#0d100e"/>
  <image x="0" y="0" width="2226" height="5481" preserveAspectRatio="none" xlink:href="01-radar-desktop.png"/>
  <g transform="translate(2260 65)"><rect class="tag" width="500" height="125"/><text class="label" x="20" y="36">01 / BRAND + NAV</text><text class="detail" x="20" y="70">Use anchors to jump</text><text class="detail" x="20" y="98">between page sections.</text><path class="line" d="M0 105 L-45 -25"/></g>
  <g transform="translate(2260 275)"><rect class="tag" width="500" height="125"/><text class="label" x="20" y="36">02 / RADAR CONSOLE</text><text class="detail" x="20" y="70">Live signal overview</text><text class="detail" x="20" y="98">and refresh status.</text><path class="line" d="M0 105 L-120 70"/></g>
  <g transform="translate(2260 870)"><rect class="tag" width="500" height="125"/><text class="label" x="20" y="36">03 / SIGNAL METRICS</text><text class="detail" x="20" y="70">Counts show activity,</text><text class="detail" x="20" y="98">not quality scores.</text><path class="line" d="M0 90 L-120 -20"/></g>
  <g transform="translate(2260 1150)"><rect class="tag" width="500" height="125"/><text class="label" x="20" y="36">04 / SEARCH + FILTER</text><text class="detail" x="20" y="70">Narrow signals by</text><text class="detail" x="20" y="98">place or evidence.</text><path class="line" d="M0 95 L-270 -20"/></g>
  <g transform="translate(2260 1510)"><rect class="tag" width="500" height="150"/><text class="label" x="20" y="36">05 / SIGNAL CARD</text><text class="detail" x="20" y="70">Select an event to</text><text class="detail" x="20" y="98">open its action panel.</text><text class="detail" x="20" y="126">Why: turn discovery into action.</text><path class="line" d="M0 95 L-115 -30"/></g>
  <g transform="translate(2260 2040)"><rect class="tag" width="500" height="150"/><text class="label" x="20" y="36">06 / INSPECT PANEL</text><text class="detail" x="20" y="70">Dates, routes, roles,</text><text class="detail" x="20" y="98">contacts, and evidence.</text><text class="detail" x="20" y="126">Unknown means confirm.</text><path class="line" d="M0 95 L-120 -80"/></g>
  <g transform="translate(2260 2860)"><rect class="tag" width="500" height="150"/><text class="label" x="20" y="36">07 / PROMPTS + STATE</text><text class="detail" x="20" y="70">Choose one GPT prompt,</text><text class="detail" x="20" y="98">bookmark, and set state.</text><text class="detail" x="20" y="126">Why: build a habit.</text><path class="line" d="M0 105 L-120 0"/></g>
  <g transform="translate(2260 3860)"><rect class="tag" width="500" height="150"/><text class="label" x="20" y="36">08 / STRATEGY</text><text class="detail" x="20" y="70">Learn, contribute,</text><text class="detail" x="20" y="98">and follow up.</text><text class="detail" x="20" y="126">Why: make signals useful.</text><path class="line" d="M0 95 L-145 20"/></g>
  <g transform="translate(2260 4700)"><rect class="tag" width="500" height="150"/><text class="label" x="20" y="36">09 / CONTACT</text><text class="detail" x="20" y="70">Open Gmail Compose</text><text class="detail" x="20" y="98">with context prefilled.</text><text class="detail" x="20" y="126">Why: send clear feedback.</text><path class="line" d="M0 95 L-170 10"/></g>
</svg>
