name: Event Agent Lite

on:
  schedule:
    # 08:00 and 20:00 IST refresh windows (UTC is four and a half hours earlier).
    - cron: '30 2 * * *'
    - cron: '30 14 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Event Agent Lite
        run: node tools/run-event-agent-lite.js

      - name: Commit generated discovery data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/event-agent-lite.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update event agent lite results"
            git push
          fi
